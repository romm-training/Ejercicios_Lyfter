user:
  states: [active, inactive, delinquent]
  transitions:
    - from: null
      to: active
      guards: [username_and_email_no_exist]
      effects: []
    - from: active
      to: delinquent
      guards: [user_is_active, user_has_no_active_rentals]
      effects: []
    - from: active
      to: inactive
      guards: [user_is_active, user_has_no_active_rentals]
      effects: []

car:
  states: [available, reserved, rented, maintenance, inactive, sold]
  transitions:
    - from: null
      to: available
      guards: []
      effects: []
    - from: available
      to: reserved
      guards: [car_is_available]
      effects: [car_to_reserved]
    - from: reserved
      to: rented
      guards: [car_is_reserved]
      effects: [car_to_rented]

car_rental:
  states: [pending, active, completed, cancelled, overdue]
  transitions:
    - from: null
      to: pending
      guards: [user_is_active, car_is_available]
      effects: [car_to_reserved]
    - from: pending
      to: active
      guards: [user_is_active, car_is_reserved]
      effects: [car_to_rented, rental_to_active]
    - from: pending
      to: cancelled
      guards: [user_is_active, rental_is_pending]
      effects: [car_to_available, rental_to_cancelled]
    - from: active
      to: completed
      guards: [user_is_active, rental_is_active, car_is_rented]
      effects: [rental_to_completed, car_to_available]
    - from: active
      to: overdue
      guards: [user_is_active, rental_is_active]
      effects: [user_to_delinquent, rental_to_overdue]
    - from: overdue
      to: completed
      guards: [user_is_delinquent, rental_is_overdue]
      effects: [rental_to_completed, user_to_active, car_to_available]
